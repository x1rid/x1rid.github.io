<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Desktop Concept — Purple Explorer</title>
<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/cascadia-mono" rel="stylesheet">
<link rel="stylesheet" href="./css/variables.css">
<style>
    /* ============================================================
       Standalone desktop prototype. Not linked from production.
       Purple Explorer: tree + details, Win95 grammar in the site's
       own palette. Real link data; no fake files.
       ============================================================ */

    :root {
        --bevel-light: rgba(255, 255, 255, 0.09);
        --bevel-dark: rgba(0, 0, 0, 0.55);
        --well-bg: #0e061e;
        --title-a: #2a1545;
        --title-b: #1a0c2e;
        --row-hover: rgba(192, 132, 252, 0.08);
        --row-selected: #3b1f5c;
        --dotted: rgba(242, 234, 255, 0.75);
        --tree-width: 220px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
        margin: 0;
        padding: 22px 22px 18px;
        display: grid;
        place-items: center;
        background:
            radial-gradient(ellipse at 50% -10%, rgba(160, 32, 240, 0.18), transparent 55%),
            radial-gradient(ellipse at 85% 110%, rgba(85, 255, 153, 0.045), transparent 40%),
            var(--surface-0);
        color: var(--ink-90);
        font: 13px/1.45 'Cascadia Mono', 'Courier New', monospace;
        overflow: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(160, 32, 240, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(160, 32, 240, 0.045) 1px, transparent 1px);
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 85%);
        mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 85%);
    }

    .concept {
        position: relative;
        z-index: 1;
        width: min(1280px, 100%);
    }

    .concept-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 0 8px;
        color: var(--ink-50);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
    }

    .concept-kicker { color: var(--signal-active); }
    .concept-title { color: var(--ink-70); }
    .concept-hint {
        margin-left: auto;
        color: var(--ink-30);
        letter-spacing: 0.08em;
    }

    .concept-foot {
        margin: 8px 0 0;
        color: var(--ink-30);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-align: right;
    }

    /* ── The window ─────────────────────────────────────────── */
    .explorer {
        display: flex;
        flex-direction: column;
        height: min(760px, calc(100vh - 112px));
        min-height: 420px;
        overflow: hidden;
        background: var(--surface-1);
        border: 1px solid var(--line-hi);
        box-shadow:
            inset 1px 1px 0 var(--bevel-light),
            inset -1px -1px 0 var(--bevel-dark),
            0 24px 70px rgba(0, 0, 0, 0.55);
    }

    .titlebar {
        flex: 0 0 auto;
        height: 34px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: linear-gradient(180deg, var(--title-a), var(--title-b));
        border-bottom: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        user-select: none;
    }

    .title-avatar {
        width: 20px;
        height: 20px;
        border: 1px solid var(--line-hi);
        image-rendering: pixelated;
    }

    .title-path { font-size: 12px; letter-spacing: 0.02em; }
    .title-root { color: var(--ink-50); }
    .title-folder { color: var(--ink-90); font-weight: 700; }

    .prototype-badge {
        margin-left: auto;
        padding: 2px 6px;
        border: 1px solid var(--line-hi);
        color: var(--signal-active);
        font-size: 9px;
        letter-spacing: 0.16em;
    }

    /* ── Toolbar ────────────────────────────────────────────── */
    .toolbar {
        flex: 0 0 auto;
        height: 38px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        background: var(--surface-1);
        border-bottom: 1px solid var(--line);
    }

    .tool-btn {
        height: 26px;
        min-width: 26px;
        padding: 0 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink-70);
        font: 700 12px/1 'Cascadia Mono', 'Courier New', monospace;
        cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease, color 80ms ease;
    }

    .tool-btn:hover:not(:disabled) {
        border-color: var(--line-hi);
        background: var(--row-hover);
        color: var(--ink-90);
        box-shadow:
            inset 1px 1px 0 var(--bevel-light),
            inset -1px -1px 0 var(--bevel-dark);
    }

    .tool-btn:active:not(:disabled) {
        transform: translate(1px, 1px);
        box-shadow: inset 1px 1px 0 var(--bevel-dark);
    }

    .tool-btn:disabled { opacity: 0.3; cursor: default; }

    .tool-sep {
        width: 1px;
        height: 20px;
        margin: 0 4px;
        background: var(--line);
    }

    .addressbar {
        flex: 1;
        min-width: 0;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--well-bg);
        border: 1px solid var(--line);
        box-shadow: inset 1px 1px 0 rgba(0, 0, 0, 0.5);
    }

    .address-icon {
        width: 14px;
        height: 10px;
        flex: 0 0 auto;
        position: relative;
        background: var(--ink-50);
        border: 1px solid var(--ink-70);
        border-radius: 1px;
    }

    .address-icon::before {
        content: '';
        position: absolute;
        left: 1px;
        top: -4px;
        width: 6px;
        height: 4px;
        background: inherit;
        border: 1px solid var(--ink-70);
        border-bottom: 0;
        border-radius: 1px 1px 0 0;
    }

    .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 1px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        font-size: 12px;
    }

    .crumb {
        padding: 1px 3px;
        border: 0;
        background: transparent;
        color: var(--ink-70);
        font: inherit;
        cursor: pointer;
    }

    .crumb:hover {
        color: var(--signal-active);
        background: var(--row-hover);
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .crumb.is-current { color: var(--ink-90); cursor: default; }
    .crumb.is-current:hover { background: transparent; text-decoration: none; }
    .crumb-sep { color: var(--ink-30); }

    .searchbox {
        width: 190px;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        background: var(--well-bg);
        border: 1px solid var(--line);
        box-shadow: inset 1px 1px 0 rgba(0, 0, 0, 0.5);
    }

    .searchbox:focus-within {
        border-color: var(--signal-active);
        box-shadow:
            inset 1px 1px 0 rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(192, 132, 252, 0.25);
    }

    .searchbox svg { width: 12px; height: 12px; flex: 0 0 auto; color: var(--ink-50); }

    .searchbox input {
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink-90);
        font: 12px 'Cascadia Mono', 'Courier New', monospace;
    }

    .searchbox input::placeholder { color: var(--ink-30); }

    .view-btn {
        min-width: 74px;
        font-size: 10px;
        letter-spacing: 0.08em;
    }

    /* ── Body: tree + list ──────────────────────────────────── */
    .body {
        flex: 1;
        min-height: 0;
        display: flex;
    }

    .tree-pane {
        width: var(--tree-width);
        flex: 0 0 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface-2);
        border-right: 1px solid var(--line);
    }

    .tree-header {
        flex: 0 0 auto;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-50);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }

    .tree-header-count { color: var(--ink-30); }

    .tree {
        flex: 1;
        overflow: auto;
        padding: 4px 0 12px;
    }

    .tree ul {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .tree-group {
        margin-left: 15px;
        border-left: 1px dotted rgba(111, 58, 147, 0.35);
    }

    .tree-row {
        position: relative;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px 0 calc(6px + var(--depth, 0) * 14px);
        color: var(--ink-70);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
        transition: background 80ms ease, color 80ms ease;
    }

    .tree-row:hover {
        background: var(--row-hover);
        color: var(--ink-90);
    }

    .tree-row:hover .twisty { color: var(--signal-active); }
    .tree-row:hover .folder-icon:not(.is-dim),
    tbody tr:hover .folder-icon:not(.is-dim) { background: #d8b4fe; }
    .tree-row:hover .folder-icon::before,
    tbody tr:hover .folder-icon::before { transform: translateY(-1px); }

    .tree-row.is-selected {
        background: var(--row-selected);
        color: var(--ink-90);
        box-shadow: inset 2px 0 0 var(--signal-active);
    }

    .tree-row.is-selected::after {
        content: '';
        position: absolute;
        inset: 2px;
        outline: 1px dotted var(--dotted);
        outline-offset: -1px;
        opacity: 0.3;
        pointer-events: none;
    }

    .tree-row.is-disabled { color: var(--ink-30); cursor: default; }
    .tree-row.is-disabled:hover { background: transparent; color: var(--ink-30); }

    .twisty {
        width: 12px;
        flex: 0 0 auto;
        text-align: center;
        color: var(--ink-50);
        font-size: 10px;
        transition: transform 100ms ease;
    }

    .tree-row[aria-expanded="true"] > .twisty { transform: rotate(90deg); }

    .tree-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .tree-count {
        flex: 0 0 auto;
        margin-left: auto;
        color: var(--ink-30);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
    }

    .tree-row.is-selected .tree-count { color: var(--ink-50); }

    .soon-badge {
        margin-left: auto;
        padding: 1px 4px;
        border: 1px solid var(--line);
        color: var(--ink-30);
        font-size: 8px;
        letter-spacing: 0.08em;
    }

    /* ── Folder / file glyphs ───────────────────────────────── */
    .folder-icon {
        position: relative;
        width: 15px;
        height: 11px;
        flex: 0 0 auto;
        background: #c084fc;
        border: 1px solid #d8b4fe;
        border-radius: 1px;
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
    }

    .folder-icon::before {
        content: '';
        position: absolute;
        left: 1px;
        top: -4px;
        width: 7px;
        height: 4px;
        background: inherit;
        border: 1px solid #d8b4fe;
        border-bottom: 0;
        border-radius: 1px 1px 0 0;
        transition: transform 120ms ease;
    }

    .folder-icon.is-open { background: #d8b4fe; }
    .folder-icon.is-open::before { transform: translateY(-1px); }
    .folder-icon.is-dim {
        background: var(--ink-30);
        border-color: var(--ink-30);
        box-shadow: none;
    }
    .folder-icon.is-dim::before { border-color: var(--ink-30); }

    .file-icon {
        position: relative;
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
    }

    .file-icon img {
        display: block;
        width: 16px;
        height: 16px;
        object-fit: contain;
    }

    .file-icon .fallback {
        display: none;
        width: 16px;
        height: 16px;
        place-items: center;
        background: var(--well-bg);
        border: 1px solid var(--line);
        color: var(--ink-70);
        font-size: 8px;
    }

    .file-icon.is-broken img { display: none; }
    .file-icon.is-broken .fallback { display: grid; }

    .file-icon .shortcut {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 8px;
        height: 8px;
        display: grid;
        place-items: center;
        background: var(--surface-1);
        border: 1px solid var(--line);
        color: var(--signal-active);
        font-size: 7px;
        line-height: 1;
    }

    .file-icon .missing-badge {
        position: absolute;
        right: -4px;
        top: -4px;
        width: 8px;
        height: 8px;
        display: grid;
        place-items: center;
        background: var(--surface-1);
        border: 1px solid var(--ink-30);
        color: var(--ink-30);
        font-size: 7px;
        line-height: 1;
    }

    .doc-icon {
        position: relative;
        width: 12px;
        height: 15px;
        flex: 0 0 auto;
        background: var(--ink-70);
        border: 1px solid var(--ink-50);
    }

    .doc-icon::before {
        content: '';
        position: absolute;
        right: 0;
        top: 0;
        border-top: 4px solid var(--surface-2);
        border-left: 4px solid transparent;
    }

    .doc-icon::after {
        content: '';
        position: absolute;
        left: 2px;
        right: 2px;
        top: 6px;
        height: 1px;
        background: var(--surface-2);
        box-shadow: 0 3px 0 var(--surface-2);
    }

    .app-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        background: var(--well-bg);
        border: 1px solid var(--line);
        color: var(--ink-50);
        font-size: 8px;
        font-weight: 700;
    }

    /* ── Splitter ───────────────────────────────────────────── */
    .splitter {
        flex: 0 0 6px;
        position: relative;
        background: var(--surface-1);
        cursor: col-resize;
        touch-action: none;
    }

    .splitter::before {
        content: '';
        position: absolute;
        inset: 0;
        border-left: 1px solid var(--line);
        border-right: 1px solid rgba(0, 0, 0, 0.4);
    }

    .splitter span {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 26px;
        transform: translate(-50%, -50%);
        background: repeating-linear-gradient(
            to bottom,
            var(--signal-active) 0 2px,
            transparent 2px 6px
        );
        opacity: 0.35;
    }

    .splitter:hover span,
    body.is-resizing .splitter span { opacity: 0.9; }

    body.is-resizing { cursor: col-resize; user-select: none; }

    /* ── List / details table ───────────────────────────────── */
    .list-pane {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface-1);
    }

    .table-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 8px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        box-shadow:
            inset 1px 1px 0 rgba(0, 0, 0, 0.55),
            inset -1px -1px 0 var(--bevel-light);
    }

    .table-wrap.is-switching { animation: view-in 140ms ease-out; }

    @keyframes view-in {
        from { opacity: 0.35; transform: translateY(2px); }
        to { opacity: 1; transform: translateY(0); }
    }

    table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    thead {
        position: sticky;
        top: 0;
        z-index: 3;
    }

    th {
        height: 26px;
        padding: 0 8px;
        background: var(--surface-1);
        border-bottom: 1px solid var(--line);
        border-right: 1px solid rgba(77, 40, 107, 0.55);
        color: var(--ink-50);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-align: left;
        text-transform: uppercase;
    }

    th:last-child { border-right: 0; }

    th button {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
        text-transform: inherit;
        cursor: pointer;
    }

    th button:hover { color: var(--ink-90); }
    th[aria-sort] { color: var(--ink-70); background: rgba(192, 132, 252, 0.05); }

    .sort-arrow {
        margin-left: auto;
        color: var(--signal-active);
        font-size: 8px;
        opacity: 0;
    }

    th[aria-sort] .sort-arrow { opacity: 1; }

    .col-name { width: 30%; }
    .col-type { width: 10%; }
    .col-target { width: 25%; }
    .col-status { width: 10%; }
    .col-note { width: 25%; }

    td {
        height: 30px;
        padding: 0 8px;
        border-bottom: 1px solid rgba(77, 40, 107, 0.28);
        color: var(--ink-50);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    tbody tr {
        cursor: pointer;
        outline: none;
        user-select: none;
        transition: background 80ms ease, box-shadow 80ms ease;
    }

    tbody tr:hover { background: var(--row-hover); }

    tbody tr:hover .filename {
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    tbody tr.is-selected {
        background: var(--row-selected);
        outline: 1px dotted rgba(242, 234, 255, 0.55);
        outline-offset: -3px;
        box-shadow:
            inset 2px 0 0 var(--signal-active),
            inset 0 0 0 1px rgba(242, 234, 255, 0.16);
    }

    tbody tr.is-selected td {
        color: var(--ink-90);
        border-bottom-color: rgba(192, 132, 252, 0.25);
    }

    tbody tr:focus-visible {
        outline: 1px dotted var(--dotted);
        outline-offset: -3px;
    }

    .name-cell {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
    }

    .filename {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink-90);
    }

    .filename .ext { color: var(--ink-50); }
    tbody tr.is-selected .filename .ext { color: var(--ink-70); }

    td.col-type {
        color: var(--ink-50);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    td.col-target { color: var(--ink-70); }
    td.col-note { color: var(--ink-50); font-size: 11px; }

    tbody tr.is-selected td.col-target,
    tbody tr.is-selected td.col-note { color: var(--ink-70); }

    td.col-status {
        color: var(--ink-70);
        font-size: 10px;
        letter-spacing: 0.08em;
    }

    .status-label { display: inline-flex; align-items: center; gap: 5px; }

    .status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--signal-active);
        box-shadow: 0 0 5px rgba(192, 132, 252, 0.4);
    }

    .open-hint {
        margin-left: 4px;
        color: var(--signal-active);
        opacity: 0;
        transition: opacity 80ms ease;
    }

    tbody tr:hover .open-hint,
    tbody tr.is-selected .open-hint { opacity: 1; }

    tbody tr.is-pending,
    tbody tr.is-pending td { color: var(--ink-30); }

    tbody tr.is-pending .filename { color: var(--ink-30); }
    tbody tr.is-pending .filename .ext { color: var(--ink-30); }
    tbody tr.is-pending .file-icon img { opacity: 0.35; filter: grayscale(1); }
    tbody tr.is-pending .status-dot { background: var(--ink-30); box-shadow: none; }
    tbody tr.is-pending:hover { background: rgba(192, 132, 252, 0.04); }
    tbody tr.is-pending:hover .filename { text-decoration: none; }

    tbody tr.is-error { animation: error-flash 600ms steps(2); }

    @keyframes error-flash {
        0%, 100% { background: transparent; }
        50% { background: rgba(255, 79, 216, 0.14); }
    }

    tbody tr.is-launching .file-icon { animation: launch 180ms steps(2); }

    @keyframes launch {
        50% { transform: scale(1.18); filter: brightness(1.4); }
    }

    .empty-row td {
        height: 120px;
        color: var(--ink-50);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
    }

    /* List view: names + status only. */
    .explorer.is-list table { table-layout: auto; }
    .explorer.is-list .col-type,
    .explorer.is-list .col-target,
    .explorer.is-list .col-note { display: none; }
    .explorer.is-list .col-name { width: auto; }
    .explorer.is-list .col-status { width: 110px; }

    /* ── Status bar ─────────────────────────────────────────── */
    .statusbar {
        flex: 0 0 auto;
        height: 28px;
        display: flex;
        align-items: center;
        border-top: 1px solid var(--line);
        background: var(--surface-1);
        color: var(--ink-50);
        font-size: 10px;
        letter-spacing: 0.04em;
    }

    .status-cell {
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border-right: 1px solid var(--line);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .status-count { min-width: 160px; }
    .status-target { flex: 1; min-width: 0; color: var(--ink-70); }
    .status-state { gap: 5px; }

    .state-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--signal-ok);
        box-shadow: 0 0 5px rgba(85, 255, 153, 0.55);
    }

    .status-clock {
        min-width: 58px;
        justify-content: flex-end;
        border-right: 0;
        font-variant-numeric: tabular-nums;
    }

    /* ── Context menu ───────────────────────────────────────── */
    .context-menu {
        position: fixed;
        z-index: 50;
        min-width: 218px;
        padding: 3px;
        background: var(--surface-1);
        border: 1px solid var(--line-hi);
        box-shadow:
            inset 1px 1px 0 var(--bevel-light),
            inset -1px -1px 0 var(--bevel-dark),
            0 12px 30px rgba(0, 0, 0, 0.5);
        color: var(--ink-70);
        font-size: 12px;
    }

    .context-menu[hidden] { display: none; }

    .menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
    }

    .menu-item:hover:not(:disabled) {
        background: var(--row-selected);
        color: var(--ink-90);
    }

    .menu-item:disabled { color: var(--ink-30); cursor: default; }

    .menu-icon {
        width: 14px;
        flex: 0 0 auto;
        color: var(--ink-50);
        text-align: center;
    }

    .menu-item:hover:not(:disabled) .menu-icon { color: var(--signal-active); }

    .menu-shortcut {
        margin-left: auto;
        color: var(--ink-30);
        font-size: 10px;
    }

    .menu-sep {
        height: 1px;
        margin: 3px 6px;
        background: var(--line);
    }

    /* ── Dialog ─────────────────────────────────────────────── */
    .dialog-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        background: rgba(7, 2, 10, 0.62);
    }

    .dialog-overlay[hidden] { display: none; }

    .dialog {
        width: min(480px, calc(100vw - 48px));
        max-height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        background: var(--surface-1);
        border: 1px solid var(--line-hi);
        box-shadow:
            inset 1px 1px 0 var(--bevel-light),
            inset -1px -1px 0 var(--bevel-dark),
            0 24px 60px rgba(0, 0, 0, 0.6);
        animation: dialog-in 120ms ease-out;
    }

    @keyframes dialog-in {
        from { opacity: 0; transform: translateY(4px) scale(0.99); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dialog-titlebar {
        height: 30px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        background: linear-gradient(180deg, var(--title-a), var(--title-b));
        border-bottom: 1px solid var(--line);
        color: var(--ink-90);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
    }

    .dialog-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px;
        background: var(--surface-2);
        color: var(--ink-70);
        font-size: 12px;
    }

    .prop-grid {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 7px 12px;
    }

    .prop-key {
        color: var(--ink-50);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .prop-value {
        color: var(--ink-90);
        overflow-wrap: anywhere;
    }

    .prop-value.is-missing { color: var(--ink-30); }

    .dialog-body pre {
        margin: 0;
        color: var(--ink-70);
        font: 12px/1.55 'Cascadia Mono', 'Courier New', monospace;
        white-space: pre-wrap;
    }

    .dialog-actions {
        flex: 0 0 auto;
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
        background: var(--surface-1);
    }

    .dialog-btn {
        min-width: 74px;
        height: 26px;
        padding: 0 12px;
        border: 1px solid var(--line-hi);
        background: var(--surface-2);
        color: var(--ink-90);
        font: 700 11px 'Cascadia Mono', 'Courier New', monospace;
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow:
            inset 1px 1px 0 var(--bevel-light),
            inset -1px -1px 0 var(--bevel-dark);
    }

    .dialog-btn:hover { border-color: var(--signal-active); color: var(--signal-active); }
    .dialog-btn:active { transform: translate(1px, 1px); box-shadow: inset 1px 1px 0 var(--bevel-dark); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 1100px) {
        .col-name { width: 34%; }
        .col-type { width: 11%; }
        .col-target { width: 30%; }
        .col-status { width: 11%; }
        .col-note { width: 14%; }
        .searchbox { width: 150px; }
    }

    @media (max-width: 960px) {
        :root { --tree-width: 210px; }
        .tree-count { display: none; }
        .col-name { width: 42%; }
        .col-type { width: 13%; }
        .col-target { width: 29%; }
        .col-status { width: 16%; }
        .col-note { display: none; }
        .concept-hint { display: none; }
    }

    @media (max-width: 760px) {
        :root { --tree-width: 200px; }
        body { padding: 10px; overflow: auto; }
        .explorer { height: calc(100vh - 90px); min-height: 420px; }
        .searchbox { width: 120px; }
        .col-target { display: none; }

        .col-type { width: 14%; }
        .col-status { width: 20%; }
        .status-count { min-width: 110px; }
        .status-state { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }
    }
</style>

<script>
(() => {
    'use strict';

    /* ── Real link data (mirrors main/data/links.json) ──────── */
    const LINKS = [
        { name: 'GitHub',       category: 'dev',    url: 'https://github.com/x1rid',            icon: './socials/icons/github.svg',      username: 'x1rid' },
        { name: 'Hugging Face', category: 'dev',    url: '#',                                   icon: './socials/icons/huggingface.svg' },
        { name: 'LinkedIn',     category: 'dev',    url: 'https://linkedin.com/in/xrid',        icon: './socials/icons/linkedin.svg',    username: 'xrid' },
        { name: 'Email',        category: 'social', url: 'mailto:ridoanulislam0@gmail.com',     icon: './socials/icons/email.svg',       username: 'ridoanulislam0@gmail.com' },
        { name: 'Reddit',       category: 'social', url: 'https://reddit.com/user/r3d1bro',     icon: './socials/icons/reddit.svg',      username: 'r3d1bro' },
        { name: 'Discord',      category: 'social', url: 'https://discord.com/users/558031359050776581', icon: './socials/icons/discord.svg', username: 'x9rid' },
        { name: 'Instagram',    category: 'social', url: 'https://instagram.com/r3d1bruh',      icon: './socials/icons/instagram.svg',   username: 'r3d1bruh' },
        { name: 'Snapchat',     category: 'social', url: 'https://snapchat.com/add/r3d1bruh',   icon: './socials/icons/snapchat.svg',    username: 'r3d1bruh' },
        { name: 'TikTok',       category: 'social', url: 'https://tiktok.com/@r3d1bruh',        icon: './socials/icons/tiktok.svg',      username: 'r3d1bruh' },
        { name: 'Twitter',      category: 'social', url: 'https://x.com/i/user/1190238367666954241', icon: './socials/icons/twitter.svg', username: 'x4rid' },
        { name: 'Telegram',     category: 'social', url: 'tg://user?id=7798423087',             icon: './socials/icons/telegram.svg',    username: '7798423087' },
        { name: 'WhatsApp',     category: 'social', url: '#',                                   icon: './socials/icons/whatsapp.svg' },
        { name: 'Facebook',     category: 'social', url: 'https://www.facebook.com/profile.php?id=100088120805119', icon: './socials/icons/facebook.svg' },
        { name: 'Steam',        category: 'play',   url: 'https://steamcommunity.com/profiles/76561199067995946', icon: './socials/icons/steam.svg', friendCode: '1107730218' },
        { name: 'Xbox',         category: 'play',   url: '#',                                   icon: './socials/icons/xbox.svg' },
        { name: 'Riot Games',   category: 'play',   url: '#',                                   icon: './socials/icons/riotgames.svg' },
        { name: 'Epic Games',   category: 'play',   url: '#',                                   icon: './socials/icons/epicgames.svg' },
        { name: 'itch.io',      category: 'play',   url: '#',                                   icon: './socials/icons/itchio.svg' },
        { name: 'Ubisoft Connect', category: 'play', url: '#',                                  icon: './socials/icons/ubisoft.svg' },
        { name: 'EA',           category: 'play',   url: '#',                                   icon: './socials/icons/ea.svg' },
        { name: 'GOG',          category: 'play',   url: '#',                                   icon: './socials/icons/gog.svg' }
    ];

    /* One-line notes are the text-heavy part. In production these
       belong in links.json next to the link, not in a UI file. */
    const NOTES = {
        'GitHub': 'code and experiments',
        'Hugging Face': 'models and datasets — no public profile yet',
        'LinkedIn': 'work and professional stuff',
        'Email': 'the most reliable way to reach me',
        'Reddit': 'lurking, mostly',
        'Discord': 'usually online after dark',
        'Instagram': 'photos',
        'Snapchat': 'rarely used',
        'TikTok': 'short videos',
        'Twitter': 'posts and links',
        'Telegram': 'direct messages',
        'WhatsApp': 'family and friends',
        'Facebook': 'rarely used',
        'Steam': 'games and friends',
        'Xbox': 'gamertag not linked yet',
        'Riot Games': 'account not linked yet',
        'Epic Games': 'account not linked yet',
        'itch.io': 'page not set up yet',
        'Ubisoft Connect': 'account not linked yet',
        'EA': 'account not linked yet',
        'GOG': 'account not linked yet'
    };

    const FOLDERS = {
        all:         { view: 'all',         note: 'Every link, pending entries last' },
        social:      { view: 'social',      note: 'Social links' },
        dev:         { view: 'dev',         note: 'Dev links' },
        play:        { view: 'play',        note: 'Play links' },
        unavailable: { view: 'unavailable', note: 'Shortcuts with no destination yet' }
    };

    const FOLDER_ORDER = ['all', 'social', 'dev', 'play', 'unavailable'];

    const README = [
        'r3d1bruh://link-exchange',
        '========================',
        '',
        'A personal site by r3d1bruh.',
        'Links, music, a terminal, and too many purple gradients.',
        '',
        'This file is part of a desktop Explorer prototype.',
        'The phone design is intentionally untouched.',
        '',
        'Try:',
        '  - click a row to select it',
        '  - double-click or press Enter to open',
        '  - right-click for the context menu',
        '  - click a column header to sort',
        '  - type in the search box to filter',
        '  - drag the splitter to resize the folder pane',
        '',
        '-- r3d1bruh'
    ].join('\n');

    const state = {
        view: 'all',
        selected: null,
        sortKey: 'name',
        sortDir: 'asc',
        search: '',
        layout: 'details',
        history: ['all'],
        historyIndex: 0,
        hovered: null,
        contextKey: null
    };

    /* ── Helpers ────────────────────────────────────────────── */
    const isPending = (link) => !link.url || link.url === '#';

    function hostOf(url) {
        if (!/^https?:\/\//i.test(String(url || ''))) return '';
        try {
            return new URL(url).hostname.replace(/^www\./, '');
        } catch (_) {
            return '';
        }
    }

    function contactOf(url) {
        const value = String(url || '');
        return /^mailto:/i.test(value) ? value.slice(7).split('?')[0] : '';
    }

    function targetOf(link) {
        if (isPending(link)) return '--';
        const mail = contactOf(link.url);
        if (mail) return mail;
        if (/^tg:/i.test(link.url)) return 'telegram';
        return hostOf(link.url) || link.url;
    }

    function typeOf(link) {
        if (isPending(link)) return 'Shortcut';
        if (/^mailto:/i.test(link.url)) return 'Mail';
        if (/^tg:/i.test(link.url)) return 'App';
        if (/^https?:/i.test(link.url)) return 'URL';
        return 'File';
    }

    function statusOf(link) {
        if (isPending(link)) return 'MISSING';
        if (/^mailto:/i.test(link.url)) return 'MAIL';
        if (/^tg:/i.test(link.url)) return 'APP';
        return 'OPEN';
    }

    function slugOf(name) {
        return String(name)
            .toLowerCase()
            .replace(/[^a-z0-9.]+/g, '-')
            .replace(/^-+|-+$/g, '');
    }

    function filenameOf(link) {
        const base = slugOf(link.name);
        if (isPending(link)) return `${base}.lnk`;
        if (/^mailto:/i.test(link.url)) return `${base}.eml`;
        return `${base}.url`;
    }

    function itemFromLink(link) {
        const filename = filenameOf(link);
        const dot = filename.lastIndexOf('.');
        return {
            key: `link:${link.name}`,
            kind: 'link',
            name: link.name,
            filename,
            base: filename.slice(0, dot),
            ext: filename.slice(dot),
            type: typeOf(link),
            target: targetOf(link),
            status: statusOf(link),
            note: NOTES[link.name] || '',
            pending: isPending(link),
            isFolder: false,
            icon: link.icon,
            data: link
        };
    }

    function countFor(view) {
        if (view === 'all') return LINKS.length;
        if (view === 'unavailable') return LINKS.filter(isPending).length;
        return LINKS.filter((link) => link.category === view).length;
    }

    function folderItem(view) {
        const meta = FOLDERS[view];
        const count = countFor(view);
        return {
            key: `folder:${view}`,
            kind: 'folder',
            view,
            name: view,
            filename: view,
            base: view,
            ext: '',
            type: 'Folder',
            target: `${count} item${count === 1 ? '' : 's'}`,
            status: '--',
            note: meta.note,
            pending: false,
            isFolder: true,
            icon: null,
            data: null
        };
    }

    function readmeItem() {
        return {
            key: 'file:readme',
            kind: 'readme',
            name: 'readme',
            filename: 'readme.txt',
            base: 'readme',
            ext: '.txt',
            type: 'Text',
            target: 'local',
            status: 'OPEN',
            note: 'About this site and this prototype',
            pending: false,
            isFolder: false,
            icon: null,
            data: null
        };
    }

    function itemsForView(view) {
        if (view === 'link-exchange') {
            return FOLDER_ORDER.map(folderItem).concat(readmeItem());
        }
        let links = LINKS;
        if (view === 'unavailable') links = LINKS.filter(isPending);
        else if (view !== 'all') links = LINKS.filter((link) => link.category === view);
        return links.map(itemFromLink);
    }

    function sortValue(item) {
        if (state.sortKey === 'type') return item.type;
        if (state.sortKey === 'target') return item.target;
        if (state.sortKey === 'status') return item.status;
        if (state.sortKey === 'note') return item.note;
        return item.name;
    }

    function sortedItems(items) {
        const dir = state.sortDir === 'asc' ? 1 : -1;
        return items.slice().sort((a, b) => {
            if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
            if (a.pending !== b.pending) return a.pending ? 1 : -1;
            const av = sortValue(a);
            const bv = sortValue(b);
            if (av === bv) return a.name.localeCompare(b.name);
            return String(av).localeCompare(String(bv), undefined, {
                numeric: true,
                sensitivity: 'base'
            }) * dir;
        });
    }

    function visibleItems() {
        const query = state.search.trim().toLowerCase();
        let items = itemsForView(state.view);
        if (query) {
            items = items.filter((item) => [
                item.name,
                item.filename,
                item.type,
                item.target,
                item.note,
                item.status
            ].join(' ').toLowerCase().includes(query));
        }
        return sortedItems(items);
    }

    /* ── DOM ────────────────────────────────────────────────── */
    const explorer = document.getElementById('explorer');
    const tree = document.getElementById('tree');
    const treeTotal = document.getElementById('tree-total');
    const fileRows = document.getElementById('file-rows');
    const fileTable = document.getElementById('file-table');
    const tableWrap = document.getElementById('table-wrap');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const search = document.getElementById('search');
    const statusCount = document.getElementById('status-count');
    const statusTarget = document.getElementById('status-target');
    const clock = document.getElementById('clock');
    const navBack = document.getElementById('nav-back');
    const navForward = document.getElementById('nav-forward');
    const navUp = document.getElementById('nav-up');
    const viewToggle = document.getElementById('view-toggle');
    const splitter = document.getElementById('splitter');
    const contextMenu = document.getElementById('context-menu');
    const dialogOverlay = document.getElementById('dialog-overlay');
    const dialogTitle = document.getElementById('dialog-title');
    const dialogBody = document.getElementById('dialog-body');
    const dialogOk = document.getElementById('dialog-ok');

    function updateClock() {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString('en-GB', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    updateClock();
    window.setInterval(updateClock, 15000);

    /* ── Rendering ──────────────────────────────────────────── */
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[ch]));

    function initialsOf(name) {
        return String(name).split(/\s+/).map((word) => word[0] || '').join('').slice(0, 2).toUpperCase();
    }

    function renderTree() {
        const selectedView = state.view;
        const expanded = state.expanded || (state.expanded = { root: true, 'link-exchange': true });
        const rootOpen = expanded.root !== false;
        const exchangeOpen = expanded['link-exchange'] !== false;

        const categoryRows = FOLDER_ORDER.map((view) => {
            const selected = view === selectedView;
            return `
                <div class="tree-row${selected ? ' is-selected' : ''}"
                     role="treeitem"
                     data-view="${view}"
                     aria-selected="${selected}"
                     tabindex="${selected ? '0' : '-1'}"
                     title="${view} — ${countFor(view)} items"
                     style="--depth:2">
                    <span class="twisty" aria-hidden="true"></span>
                    <span class="folder-icon${view === 'unavailable' ? ' is-dim' : ''}${selected ? ' is-open' : ''}" aria-hidden="true"></span>
                    <span class="tree-label">${view}</span>
                    <span class="tree-count">${countFor(view)}</span>
                </div>`;
        }).join('');

        const special = (icon, label) => `
            <div class="tree-row is-disabled" role="treeitem" aria-disabled="true" tabindex="-1" title="${label} — not part of this prototype" style="--depth:1">
                <span class="twisty" aria-hidden="true"></span>
                <span class="app-icon" aria-hidden="true">${icon}</span>
                <span class="tree-label">${label}</span>
                <span class="soon-badge">SOON</span>
            </div>`;

        const exchangeSelected = selectedView === 'link-exchange';

        tree.innerHTML = `
            <div class="tree-row"
                 role="treeitem"
                 data-node="root"
                 aria-expanded="${rootOpen}"
                 tabindex="-1"
                 title="r3d1bruh"
                 style="--depth:0">
                <span class="twisty" aria-hidden="true">▸</span>
                <span class="app-icon" aria-hidden="true">▣</span>
                <span class="tree-label">r3d1bruh</span>
            </div>
            <div class="tree-group" role="group" ${rootOpen ? '' : 'hidden'}>
                <div class="tree-row${exchangeSelected ? ' is-selected' : ''}"
                     role="treeitem"
                     data-view="link-exchange"
                     aria-expanded="${exchangeOpen}"
                     aria-selected="${exchangeSelected}"
                     tabindex="${exchangeSelected ? '0' : '-1'}"
                     title="link-exchange — ${LINKS.length} links"
                     style="--depth:1">
                    <span class="twisty" aria-hidden="true">▸</span>
                    <span class="folder-icon${exchangeOpen ? ' is-open' : ''}" aria-hidden="true"></span>
                    <span class="tree-label">link-exchange</span>
                </div>
                <div class="tree-group" role="group" ${exchangeOpen ? '' : 'hidden'}>
                    ${categoryRows}
                </div>
                ${special('&gt;_', 'terminal')}
                ${special('▤', 'neofetch')}
                ${special('▦', 'pages')}
            </div>`;
    }

    function renderBreadcrumbs() {
        const crumbs = [];
        crumbs.push(`<button class="crumb" type="button" data-crumb="link-exchange">r3d1bruh://</button>`);
        crumbs.push(`<span class="crumb-sep" aria-hidden="true">\\</span>`);
        if (state.view === 'link-exchange') {
            crumbs.push(`<span class="crumb is-current">link-exchange</span>`);
        } else {
            crumbs.push(`<button class="crumb" type="button" data-crumb="link-exchange">link-exchange</button>`);
            crumbs.push(`<span class="crumb-sep" aria-hidden="true">\\</span>`);
            crumbs.push(`<span class="crumb is-current">${escapeHtml(state.view)}</span>`);
        }
        breadcrumbs.innerHTML = crumbs.join('');
    }

    function iconHtml(item) {
        if (item.isFolder) {
            const open = item.view === state.view ? ' is-open' : '';
            const dim = item.view === 'unavailable' ? ' is-dim' : '';
            return `<span class="folder-icon${open}${dim}" aria-hidden="true"></span>`;
        }
        if (item.kind === 'readme') {
            return '<span class="doc-icon" aria-hidden="true"></span>';
        }
        const badge = item.pending
            ? '<span class="missing-badge" aria-hidden="true">×</span>'
            : '<span class="shortcut" aria-hidden="true">↗</span>';
        return `<span class="file-icon">
            <img src="${escapeHtml(item.icon)}" alt="" width="16" height="16" loading="lazy">
            <span class="fallback" aria-hidden="true">${escapeHtml(initialsOf(item.name))}</span>
            ${badge}
        </span>`;
    }

    function renderList() {
        const items = visibleItems();
        const viewTotal = itemsForView(state.view).length;

        if (state.selected && !items.some((item) => item.key === state.selected)) {
            state.selected = null;
        }

        if (!items.length) {
            fileRows.innerHTML = `<tr class="empty-row"><td colspan="5">${state.search ? 'NO FILES MATCH' : 'NO FILES IN THIS FOLDER'}</td></tr>`;
            updateStatus();
            return;
        }

        fileRows.innerHTML = items.map((item, index) => {
            const selected = item.key === state.selected;
            const tabindex = selected || (!state.selected && index === 0) ? '0' : '-1';
            const classes = [
                selected ? 'is-selected' : '',
                item.pending ? 'is-pending' : ''
            ].filter(Boolean).join(' ');
            const status = item.isFolder
                ? '<span class="status-label">--</span>'
                : item.pending
                    ? `<span class="status-label"><span class="status-dot" aria-hidden="true"></span>MISSING</span>`
                    : `<span class="status-label"><span class="status-dot" aria-hidden="true"></span>${escapeHtml(item.status)}<span class="open-hint" aria-hidden="true">→</span></span>`;

            return `
                <tr class="${classes}"
                    data-key="${escapeHtml(item.key)}"
                    data-kind="${item.kind}"
                    ${item.view ? `data-view="${item.view}"` : ''}
                    aria-selected="${selected}"
                    title="${escapeHtml(item.filename)} — ${escapeHtml(item.target)}"
                    tabindex="${tabindex}">
                    <td class="col-name">
                        <span class="name-cell">
                            ${iconHtml(item)}
                            <span class="filename">${escapeHtml(item.base)}<span class="ext">${escapeHtml(item.ext)}</span></span>
                        </span>
                    </td>
                    <td class="col-type">${escapeHtml(item.type)}</td>
                    <td class="col-target">${escapeHtml(item.target)}</td>
                    <td class="col-status">${status}</td>
                    <td class="col-note">${escapeHtml(item.note)}</td>
                </tr>`;
        }).join('');

        fileRows.querySelectorAll('.file-icon img').forEach((img) => {
            img.addEventListener('error', () => {
                const frame = img.closest('.file-icon');
                if (frame) frame.classList.add('is-broken');
            }, { once: true });
        });

        state.visibleCount = items.length;
        state.viewTotal = viewTotal;
        updateStatus();
    }

    function previewFor(item) {
        if (!item) return '';
        if (item.isFolder) return `${item.name} — ${item.target}`;
        if (item.kind === 'readme') return `Open readme.txt — ${item.note}`;
        if (item.pending) return `Shortcut target missing — ${item.name} has no destination yet`;
        return `Open ${item.name} — ${item.target}`;
    }

    function updateStatus() {
        const items = visibleItems();
        const selected = items.find((item) => item.key === state.selected);
        const hovered = items.find((item) => item.key === state.hovered);

        if (selected) {
            statusCount.textContent = '1 selected';
        } else if (state.search) {
            statusCount.textContent = `${items.length} of ${itemsForView(state.view).length} objects`;
        } else {
            statusCount.textContent = `${items.length} object${items.length === 1 ? '' : 's'}`;
        }

        if (hovered) statusTarget.textContent = previewFor(hovered);
        else if (selected) statusTarget.textContent = previewFor(selected);
        else statusTarget.textContent = 'Double-click or press Enter to open · right-click for options';
    }

    function updateToolbar() {
        navBack.disabled = state.historyIndex <= 0;
        navForward.disabled = state.historyIndex >= state.history.length - 1;
        navUp.disabled = state.view === 'link-exchange';
        viewToggle.textContent = state.layout === 'list' ? 'LIST' : 'DETAILS';
        viewToggle.setAttribute('aria-pressed', String(state.layout === 'list'));
    }

    function animateList() {
        tableWrap.classList.remove('is-switching');
        void tableWrap.offsetWidth;
        tableWrap.classList.add('is-switching');
        window.setTimeout(() => tableWrap.classList.remove('is-switching'), 170);
    }

    function render() {
        renderTree();
        renderBreadcrumbs();
        renderList();
        updateToolbar();
    }

    function applyView(view) {
        state.view = view;
        state.selected = null;
        state.search = '';
        state.hovered = null;
        search.value = '';
        render();
        animateList();
    }

    function navigate(view, push = true) {
        if (!view || view === state.view) return;
        if (push) {
            state.history = state.history.slice(0, state.historyIndex + 1);
            state.history.push(view);
            state.historyIndex = state.history.length - 1;
        }
        applyView(view);
    }

    function goBack() {
        if (state.historyIndex <= 0) return;
        state.historyIndex -= 1;
        applyView(state.history[state.historyIndex]);
    }

    function goForward() {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex += 1;
        applyView(state.history[state.historyIndex]);
    }

    function goUp() {
        if (state.view === 'link-exchange') return;
        navigate('link-exchange');
    }

    /* ── Selection and actions ──────────────────────────────── */
    function findItemByKey(key) {
        return itemsForView(state.view).find((item) => item.key === key) || null;
    }

    function selectItem(key) {
        state.selected = key || null;
        const rows = Array.from(fileRows.querySelectorAll('tr[data-key]'));
        rows.forEach((row, index) => {
            const selected = row.dataset.key === state.selected;
            row.classList.toggle('is-selected', selected);
            row.setAttribute('aria-selected', String(selected));
            row.tabIndex = selected || (!state.selected && index === 0) ? 0 : -1;
        });
        updateStatus();
    }

    function launchUrl(url) {
        if (/^https?:/i.test(url)) {
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            return;
        }
        window.location.href = url;
    }

    function launchItem(item) {
        const row = Array.from(fileRows.children).find((tr) => tr.dataset.key === item.key);
        if (row) {
            row.classList.add('is-launching');
            window.setTimeout(() => row.classList.remove('is-launching'), 220);
        }
        statusTarget.textContent = `OPENING ${item.name} — ${item.target}`;
        launchUrl(item.data.url);
        window.setTimeout(updateStatus, 1400);
    }

    function flashMissing(item) {
        const row = Array.from(fileRows.children).find((tr) => tr.dataset.key === item.key);
        if (row) {
            row.classList.add('is-error');
            window.setTimeout(() => row.classList.remove('is-error'), 650);
        }
        statusTarget.textContent = `TARGET MISSING — ${item.name} has no destination yet`;
        window.setTimeout(updateStatus, 1800);
    }

    function openItem(item) {
        if (!item) return;
        if (item.isFolder) {
            navigate(item.view);
            return;
        }
        if (item.kind === 'readme') {
            openReadme();
            return;
        }
        if (item.pending) {
            flashMissing(item);
            return;
        }
        launchItem(item);
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (_) {
            const area = document.createElement('textarea');
            area.value = text;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            try { document.execCommand('copy'); } catch (__) {}
            area.remove();
        }
        statusTarget.textContent = `COPIED — ${text}`;
        window.setTimeout(updateStatus, 1600);
    }

    /* ── Context menu ───────────────────────────────────────── */
    function hideContextMenu() {
        contextMenu.hidden = true;
        contextMenu.innerHTML = '';
        state.contextKey = null;
    }

    function showContextMenu(item, x, y) {
        state.contextKey = item.key;
        const canOpen = !item.pending;
        const isHttp = Boolean(item.data && /^https?:/i.test(item.data.url));

        contextMenu.innerHTML = `
            <button class="menu-item" type="button" role="menuitem" data-action="open" ${canOpen ? '' : 'disabled'}>
                <span class="menu-icon" aria-hidden="true">▸</span>Open
                <span class="menu-shortcut">Enter</span>
            </button>
            <button class="menu-item" type="button" role="menuitem" data-action="newtab" ${isHttp ? '' : 'disabled'}>
                <span class="menu-icon" aria-hidden="true">↗</span>Open in new tab
                <span class="menu-shortcut">Ctrl+Enter</span>
            </button>
            <button class="menu-item" type="button" role="menuitem" data-action="copy" ${canOpen ? '' : 'disabled'}>
                <span class="menu-icon" aria-hidden="true">⧉</span>Copy link
                <span class="menu-shortcut">Ctrl+C</span>
            </button>
            <div class="menu-sep" role="separator"></div>
            <button class="menu-item" type="button" role="menuitem" data-action="properties">
                <span class="menu-icon" aria-hidden="true">i</span>Properties
                <span class="menu-shortcut">Alt+Enter</span>
            </button>
            <div class="menu-sep" role="separator"></div>
            <button class="menu-item" type="button" role="menuitem" data-action="cancel">
                <span class="menu-icon" aria-hidden="true">×</span>Cancel
                <span class="menu-shortcut">Esc</span>
            </button>`;
        contextMenu.hidden = false;

        const rect = contextMenu.getBoundingClientRect();
        const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
        const top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
        contextMenu.style.left = `${left}px`;
        contextMenu.style.top = `${top}px`;

        const first = contextMenu.querySelector('.menu-item:not(:disabled)');
        if (first) first.focus();
    }

    contextMenu.addEventListener('click', (event) => {
        const button = event.target.closest('.menu-item');
        if (!button || button.disabled) return;
        const item = state.contextKey ? findItemByKey(state.contextKey) : null;
        const action = button.dataset.action;

        if (action === 'cancel') {
            hideContextMenu();
            return;
        }
        if (!item) {
            hideContextMenu();
            return;
        }

        hideContextMenu();
        if (action === 'open') openItem(item);
        else if (action === 'newtab' && item.data) window.open(item.data.url, '_blank', 'noopener');
        else if (action === 'copy' && item.data) copyText(item.data.url);
        else if (action === 'properties') openProperties(item);
    });

    contextMenu.addEventListener('keydown', (event) => {
        const items = Array.from(contextMenu.querySelectorAll('.menu-item:not(:disabled)'));
        const index = items.indexOf(document.activeElement);
        if (event.key === 'ArrowDown') {
            event.preventDefault();
            items[(index + 1) % items.length]?.focus();
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            items[(index - 1 + items.length) % items.length]?.focus();
        } else if (event.key === 'Escape') {
            event.preventDefault();
            hideContextMenu();
        }
    });

    /* ── Dialogs ────────────────────────────────────────────── */
    let lastFocus = null;

    function openDialog(title, html) {
        lastFocus = document.activeElement;
        dialogTitle.textContent = title;
        dialogBody.innerHTML = html;
        dialogOverlay.hidden = false;
        dialogOk.focus();
    }

    function closeDialog() {
        dialogOverlay.hidden = true;
        dialogBody.innerHTML = '';
        if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
        lastFocus = null;
    }

    function propRow(key, value, missing = false) {
        return `<div class="prop-key">${escapeHtml(key)}</div>
                <div class="prop-value${missing ? ' is-missing' : ''}">${escapeHtml(value)}</div>`;
    }

    function openProperties(item) {
        let rows = '';
        if (item.isFolder) {
            rows += propRow('Name', item.name);
            rows += propRow('Type', 'Folder');
            rows += propRow('Contains', item.target);
            rows += propRow('Location', `r3d1bruh://link-exchange\\${item.name}`);
            rows += propRow('Note', item.note);
        } else if (item.kind === 'readme') {
            rows += propRow('Name', item.filename);
            rows += propRow('Type', 'Text Document');
            rows += propRow('Location', 'r3d1bruh://link-exchange\\readme.txt');
            rows += propRow('Note', item.note);
        } else {
            rows += propRow('Name', item.filename);
            rows += propRow('Type', item.type);
            rows += propRow('Target', item.target, item.pending);
            rows += propRow('Category', item.data.category);
            rows += propRow('Username', item.data.username || '--', !item.data.username);
            rows += propRow('Friend code', item.data.friendCode || '--', !item.data.friendCode);
            rows += propRow('Status', item.status, item.pending);
            rows += propRow('Note', item.note || '--', !item.note);
        }
        openDialog(`${item.filename} Properties`, `<div class="prop-grid">${rows}</div>`);
    }

    function openReadme() {
        openDialog('readme.txt — Notepad', `<pre>${escapeHtml(README)}</pre>`);
    }

    dialogOk.addEventListener('click', closeDialog);
    dialogOverlay.addEventListener('click', (event) => {
        if (event.target === dialogOverlay) closeDialog();
    });

    /* ── Tree interactions ──────────────────────────────────── */
    function toggleTreeNode(row) {
        const node = row.dataset.node || row.dataset.view;
        const group = row.nextElementSibling;
        if (!group || !group.classList.contains('tree-group')) return;
        const open = row.getAttribute('aria-expanded') === 'true';
        const next = !open;
        row.setAttribute('aria-expanded', String(next));
        group.hidden = !next;
        if (!next) {
            tree.querySelectorAll('.tree-row').forEach((item) => { item.tabIndex = -1; });
            row.tabIndex = 0;
        }
        if (node) {
            state.expanded = state.expanded || {};
            state.expanded[node] = next;
        }
    }

    function treeRows() {
        return Array.from(tree.querySelectorAll('.tree-row'))
            .filter((row) => !row.closest('.tree-group[hidden]'));
    }

    function focusTreeRow(row) {
        if (!row) return;
        tree.querySelectorAll('.tree-row').forEach((item) => { item.tabIndex = -1; });
        row.tabIndex = 0;
        row.focus();
    }

    tree.addEventListener('click', (event) => {
        const row = event.target.closest('.tree-row');
        if (!row) return;

        if (event.target.closest('.twisty') && row.hasAttribute('aria-expanded')) {
            event.preventDefault();
            toggleTreeNode(row);
            return;
        }

        if (row.classList.contains('is-disabled')) {
            const label = row.querySelector('.tree-label')?.textContent || 'This node';
            statusTarget.textContent = `${label} — not part of this prototype`;
            return;
        }

        if (row.dataset.view) navigate(row.dataset.view);
        else if (row.dataset.node === 'root') toggleTreeNode(row);
    });

    tree.addEventListener('keydown', (event) => {
        const row = event.target.closest('.tree-row');
        if (!row) return;
        const rows = treeRows();
        const index = rows.indexOf(row);

        if (event.key === 'ArrowDown') {
            event.preventDefault();
            focusTreeRow(rows[Math.min(index + 1, rows.length - 1)]);
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            focusTreeRow(rows[Math.max(index - 1, 0)]);
        } else if (event.key === 'Home') {
            event.preventDefault();
            focusTreeRow(rows[0]);
        } else if (event.key === 'End') {
            event.preventDefault();
            focusTreeRow(rows[rows.length - 1]);
        } else if (event.key === 'ArrowRight') {
            event.preventDefault();
            if (row.getAttribute('aria-expanded') === 'false') {
                toggleTreeNode(row);
            } else {
                const group = row.nextElementSibling;
                if (group && group.classList.contains('tree-group') && !group.hidden) {
                    const first = group.querySelector('.tree-row');
                    if (first) focusTreeRow(first);
                }
            }
        } else if (event.key === 'ArrowLeft') {
            event.preventDefault();
            if (row.getAttribute('aria-expanded') === 'true') {
                toggleTreeNode(row);
            } else {
                const group = row.closest('.tree-group');
                const parent = group ? group.previousElementSibling : null;
                if (parent && parent.classList.contains('tree-row')) focusTreeRow(parent);
            }
        } else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (row.classList.contains('is-disabled')) {
                const label = row.querySelector('.tree-label')?.textContent || 'This node';
                statusTarget.textContent = `${label} — not part of this prototype`;
            } else if (row.dataset.view) {
                navigate(row.dataset.view);
            } else {
                toggleTreeNode(row);
            }
        }
    });

    tree.addEventListener('mouseover', (event) => {
        const row = event.target.closest('.tree-row');
        if (!row || row.contains(event.relatedTarget)) return;
        const label = row.querySelector('.tree-label')?.textContent || '';
        if (row.classList.contains('is-disabled')) {
            statusTarget.textContent = `${label} — not part of this prototype`;
        } else if (row.dataset.view) {
            const count = countFor(row.dataset.view);
            statusTarget.textContent = `${label} — ${count} item${count === 1 ? '' : 's'}`;
        } else {
            statusTarget.textContent = label;
        }
    });

    tree.addEventListener('mouseleave', updateStatus);

    /* ── List interactions ──────────────────────────────────── */
    fileRows.addEventListener('click', (event) => {
        const row = event.target.closest('tr[data-key]');
        if (!row) return;
        selectItem(row.dataset.key);
    });

    fileRows.addEventListener('dblclick', (event) => {
        const row = event.target.closest('tr[data-key]');
        if (!row) return;
        openItem(findItemByKey(row.dataset.key));
    });

    fileRows.addEventListener('contextmenu', (event) => {
        const row = event.target.closest('tr[data-key]');
        if (!row) return;
        event.preventDefault();
        const item = findItemByKey(row.dataset.key);
        if (!item) return;
        selectItem(row.dataset.key);
        showContextMenu(item, event.clientX, event.clientY);
    });

    fileRows.addEventListener('mouseover', (event) => {
        const row = event.target.closest('tr[data-key]');
        if (!row || row.contains(event.relatedTarget)) return;
        state.hovered = row.dataset.key;
        updateStatus();
    });

    fileRows.addEventListener('mouseleave', () => {
        state.hovered = null;
        updateStatus();
    });

    fileRows.addEventListener('keydown', (event) => {
        const row = event.target.closest('tr[data-key]');
        if (!row) return;
        const rows = Array.from(fileRows.querySelectorAll('tr[data-key]'));
        const index = rows.indexOf(row);

        if (event.key === 'Enter' && !event.altKey && !event.ctrlKey) {
            event.preventDefault();
            openItem(findItemByKey(row.dataset.key));
        } else if (event.key === ' ') {
            event.preventDefault();
            selectItem(row.dataset.key);
        } else if (event.key === 'ArrowDown') {
            event.preventDefault();
            const next = rows[Math.min(index + 1, rows.length - 1)];
            if (next) { selectItem(next.dataset.key); next.focus(); }
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            const previous = rows[Math.max(index - 1, 0)];
            if (previous) { selectItem(previous.dataset.key); previous.focus(); }
        } else if (event.key === 'Home') {
            event.preventDefault();
            if (rows[0]) { selectItem(rows[0].dataset.key); rows[0].focus(); }
        } else if (event.key === 'End') {
            event.preventDefault();
            const last = rows[rows.length - 1];
            if (last) { selectItem(last.dataset.key); last.focus(); }
        } else if (event.key === 'Escape') {
            event.preventDefault();
            selectItem(null);
        }
    });

    tableWrap.addEventListener('click', (event) => {
        if (event.target.closest('tr[data-key]')) return;
        if (event.target.closest('th')) return;
        selectItem(null);
    });

    /* ── Search, sort, view ─────────────────────────────────── */
    search.addEventListener('input', () => {
        state.search = search.value;
        renderList();
    });

    search.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            search.value = '';
            state.search = '';
            renderList();
        }
    });

    function updateSortHeaders() {
        fileTable.querySelectorAll('th[data-sort]').forEach((th) => {
            const active = th.dataset.sort === state.sortKey;
            if (active) {
                th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
            } else {
                th.removeAttribute('aria-sort');
            }
            const arrow = th.querySelector('.sort-arrow');
            if (arrow) arrow.textContent = active && state.sortDir === 'desc' ? '▼' : '▲';
        });
    }

    fileTable.querySelectorAll('th[data-sort] button').forEach((button) => {
        button.addEventListener('click', () => {
            const key = button.dataset.sortKey;
            if (state.sortKey === key) {
                state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortKey = key;
                state.sortDir = 'asc';
            }
            updateSortHeaders();
            renderList();
        });
    });

    viewToggle.addEventListener('click', () => {
        state.layout = state.layout === 'details' ? 'list' : 'details';
        explorer.classList.toggle('is-list', state.layout === 'list');
        updateToolbar();
    });

    /* ── Navigation ─────────────────────────────────────────── */
    navBack.addEventListener('click', goBack);
    navForward.addEventListener('click', goForward);
    navUp.addEventListener('click', goUp);

    breadcrumbs.addEventListener('click', (event) => {
        const crumb = event.target.closest('[data-crumb]');
        if (crumb) navigate(crumb.dataset.crumb);
    });

    /* ── Splitter ───────────────────────────────────────────── */
    function setTreeWidth(width) {
        const clamped = Math.max(160, Math.min(360, width));
        explorer.style.setProperty('--tree-width', `${clamped}px`);
        splitter.setAttribute('aria-valuenow', String(Math.round(clamped)));
    }

    splitter.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const startX = event.clientX;
        const startWidth = parseFloat(
            getComputedStyle(explorer).getPropertyValue('--tree-width')
        ) || 220;

        document.body.classList.add('is-resizing');
        try { splitter.setPointerCapture(event.pointerId); } catch (_) {}

        const onMove = (moveEvent) => {
            setTreeWidth(startWidth + moveEvent.clientX - startX);
        };

        const onUp = () => {
            document.body.classList.remove('is-resizing');
            splitter.removeEventListener('pointermove', onMove);
            splitter.removeEventListener('pointerup', onUp);
            splitter.removeEventListener('pointercancel', onUp);
        };

        splitter.addEventListener('pointermove', onMove);
        splitter.addEventListener('pointerup', onUp);
        splitter.addEventListener('pointercancel', onUp);
    });

    splitter.addEventListener('keydown', (event) => {
        const current = parseInt(splitter.getAttribute('aria-valuenow'), 10) || 220;
        if (event.key === 'ArrowLeft') {
            event.preventDefault();
            setTreeWidth(current - 10);
        } else if (event.key === 'ArrowRight') {
            event.preventDefault();
            setTreeWidth(current + 10);
        } else if (event.key === 'Home') {
            event.preventDefault();
            setTreeWidth(160);
        } else if (event.key === 'End') {
            event.preventDefault();
            setTreeWidth(360);
        }
    });

    /* ── Global keys ────────────────────────────────────────── */
    document.addEventListener('click', (event) => {
        if (!contextMenu.hidden && !contextMenu.contains(event.target)) hideContextMenu();
    });

    window.addEventListener('resize', hideContextMenu);
    document.addEventListener('scroll', hideContextMenu, true);

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            if (!contextMenu.hidden) {
                hideContextMenu();
                return;
            }
            if (!dialogOverlay.hidden) {
                closeDialog();
                return;
            }
        }

        if (!dialogOverlay.hidden) return;
        if (!contextMenu.hidden) return;
        if (event.defaultPrevented) return;

        const target = event.target;
        const inField = target instanceof Element && target.matches('input, textarea');

        if (!inField && event.altKey && event.key === 'ArrowLeft') {
            event.preventDefault();
            goBack();
        } else if (!inField && event.altKey && event.key === 'ArrowRight') {
            event.preventDefault();
            goForward();
        } else if (!inField && event.key === 'Backspace') {
            event.preventDefault();
            goUp();
        } else if (!inField && event.ctrlKey && event.key === 'Enter' && state.selected) {
            const item = findItemByKey(state.selected);
            if (item && item.data && /^https?:/i.test(item.data.url)) {
                event.preventDefault();
                window.open(item.data.url, '_blank', 'noopener');
            }
        } else if (!inField && event.ctrlKey && event.key.toLowerCase() === 'c' && state.selected && !window.getSelection().toString()) {
            const item = findItemByKey(state.selected);
            if (item && item.data && !item.pending) {
                event.preventDefault();
                copyText(item.data.url);
            }
        } else if (!inField && event.altKey && event.key === 'Enter' && state.selected) {
            event.preventDefault();
            const item = findItemByKey(state.selected);
            if (item) openProperties(item);
        }
    });

    /* ── Init ───────────────────────────────────────────────── */
    treeTotal.textContent = `${LINKS.length} LINKS`;
    updateSortHeaders();
    render();
    updateClock();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Winamp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 30% 0%, rgba(192, 132, 252, 0.12), transparent 45%),
                #07020a;
            color: #f2eaff;
            font: 12px/1.4 'Cascadia Mono', 'Courier New', monospace;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="lib/webamp.bundle.min.js"></script>
    <script>
        (function () {
            'use strict';

            const app = document.getElementById('app');
            if (!window.Webamp || !app) {
                app.textContent = 'Winamp could not load in this browser.';
                return;
            }

            const webamp = new Webamp({
                initialTracks: [
                    {
                        metaData: {
                            artist: 'DJ Mike Llama',
                            title: "Llama Whippin' Intro"
                        },
                        url: 'mp3/llama-2.91.mp3',
                        duration: 5.322286
                    },
                    {
                        metaData: {
                            artist: 'Basshunter',
                            title: 'In Her Eyes'
                        },
                        url: '../../../playlist/6._Basshunter_-_In_Her_Eyes-pREJQbSl33Y.opus'
                    },
                    {
                        metaData: {
                            artist: 'Crystal Castles',
                            title: 'Suffocation'
                        },
                        url: '../../../playlist/Crystal Castles - Suffocation [Z0NGdLr4img].opus'
                    },
                    {
                        metaData: {
                            artist: 'Scene Girl',
                            title: 'Pretty Scene Girl'
                        },
                        url: '../../../playlist/Pretty_Scene_Girl-P8F1RjcWLjM.opus'
                    },
                    {
                        metaData: {
                            artist: 'The Cure',
                            title: "Friday I'm In Love"
                        },
                        url: "../../../playlist/The Cure - Friday I'm In Love [mGgMZpGYiy8].opus"
                    }
                ],
                initialSkin: {
                    url: 'skins/base-2.91.wsz'
                },
                enableHotkeys: true,
                __initialWindowLayout: {
                    main: { position: { x: 0, y: 0 } },
                    equalizer: { position: { x: 0, y: 116 } },
                    playlist: { position: { x: 0, y: 232 }, size: [0, 4] }
                }
            });

            webamp.renderWhenReady(app).catch((error) => {
                console.error('Winamp failed to render:', error);
                app.textContent = 'Winamp could not start in this browser.';
            });
        })();
    </script>
</body>
</html>
